# Relay for IRIB TV3 / Varzesh video segments (30nama Live TV). Runs on a server WITH AN IRANIAN IP.
# Telewebion answers 451 to non-Iranian addresses for these two channels; this server fetches the
# .ts segments for the TV. Only Telewebion edge hosts and only .ts files are forwarded (no open proxy).
#
# Install (Debian/Ubuntu): apt install nginx; copy this file to /etc/nginx/conf.d/telewebion-relay.conf;
# nginx -t && systemctl reload nginx; open TCP 8080 in the firewall.
# Then set IRAN_RELAY = "http://<server-ip>:8080/tw" in worker.js and deploy the Worker again.
#
# Optional: restrict access to your home IP (allow <your-ip>; deny all;) – the TV fetches the segments itself.

server {
    listen 8080;
    server_name _;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    location ~ "^/tw/(live-aburayhan[0-9]{4}\.telewebion\.(ir|net))/(ek/[A-Za-z0-9_/-]+\.ts)$" {
        set $tw_host $1;
        set $tw_path $3;
        proxy_pass https://$tw_host/$tw_path$is_args$args;
        proxy_set_header Host $tw_host;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
        proxy_ssl_name $tw_host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_buffering on;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=60" always;
    }

    location / { return 404; }
}
