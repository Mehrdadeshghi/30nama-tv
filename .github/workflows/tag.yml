name: Tag release

# Creates the tag vX.Y.Z on main and starts "Release wgt" for it (for sessions that cannot push tags).
# A tag pushed with GITHUB_TOKEN does not start other workflows by itself, so the release is dispatched explicitly.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z (must match package.json)'
        required: true

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
        run: |
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 1.2.3"; exit 1; }
          grep -q "\"version\": \"$V\"" package.json || { echo "package.json is not $V"; exit 1; }
          git tag "v$V"
          git push origin "v$V"
          gh workflow run release.yml --ref "v$V"
